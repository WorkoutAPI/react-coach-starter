services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coach
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - coach_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach"]
      interval: 5s
      retries: 10
volumes:
  coach_pg:
